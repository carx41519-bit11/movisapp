plugins { id 'com.android.application' }
dependencies { implementation 'androidx.exifinterface:exifinterface:1.4.2' }
android {
    namespace 'com.movis.warehouse'
    compileSdk 35
    defaultConfig {
        applicationId 'com.movis.warehouse'
        minSdk 26
        targetSdk 35
        versionCode 101
        versionName '1.0.1'
    }
    signingConfigs {
        debug {
            if (project.hasProperty('movisDebugKeystore')) {
                storeFile file(project.property('movisDebugKeystore'))
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def signingFile = rootProject.file('keystore.properties')
    if (signingFile.exists()) {
        def signingValues = new Properties()
        signingFile.withInputStream { signingValues.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
