services:
  - type: web
    name: movis
    runtime: docker
    dockerfilePath: ./Dockerfile.yolo
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOVIS_ADMIN_USERNAME
        sync: false
      - key: MOVIS_ADMIN_PASSWORD
        sync: false
      - key: MOVIS_MODE
        value: yolo
      - key: MOVIS_SEED_DEMO
        value: "0"
      - key: MOVIS_HTTPS_HOSTING
        value: "1"
      - key: MOVIS_WEIGHTS
        value: /app/models/best.pt
      - key: MOVIS_WEIGHTS_SHA256
        value: b3497135013aeeafa9505f561ee6749f04c98e11d2555ebec10e1683c6550e64
