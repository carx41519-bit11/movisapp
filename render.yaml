services:
  - type: web
    name: movis
    runtime: docker
    dockerfilePath: ./Dockerfile.yolo
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOVIS_ADMIN_USERNAME
        sync: false
      - key: MOVIS_ADMIN_PASSWORD
        sync: false
      - key: MOVIS_MODE
        value: yolo
      - key: MOVIS_SEED_DEMO
        value: "0"
      - key: MOVIS_HTTPS_HOSTING
        value: "1"
      - key: MOVIS_WEIGHTS
        value: /app/models/best.pt
      - key: MOVIS_WEIGHTS_SHA256
        value: a9c52df8fa40ab14501ae36b9f17be34129eee896fd32202b5dd6276e425b2ce
